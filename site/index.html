<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizWalah Daily Current Affairs</title>
  <meta name="description" content="Public, source-linked bilingual (English & Hindi) daily current-affairs practice quizzes for Indian competitive exams by QuizWalah.">
  <meta property="og:title" content="QuizWalah Daily Current Affairs">
  <meta property="og:description" content="Practice daily bilingual current-affairs MCQs backed by linked public news sources.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800' font-size='34'%3EQ%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #4f46e5;
      --ok-bg: #ecfdf5;
      --ok-border: #10b981;
      --err-bg: #fef2f2;
      --err-border: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --surface: #111827;
        --border: #1f2937;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #818cf8;
        --ok-bg: rgba(16, 185, 129, 0.14);
        --ok-border: #10b981;
        --err-bg: rgba(239, 68, 68, 0.14);
        --err-border: #ef4444;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; }
    .meta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button.btn, a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 8px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-weight: 600; font-size: 0.875rem;
      cursor: pointer; text-decoration: none;
    }
    button.btn[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); }
    .set-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    .q-title { font-weight: 700; margin: 0 0 12px; white-space: pre-line; }
    .options { display: grid; gap: 8px; }
    .opt-btn {
      width: 100%; text-align: left; padding: 10px 12px; min-height: 44px;
      border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 0.92rem; cursor: pointer;
    }
    .opt-btn.correct { background: var(--ok-bg); border-color: var(--ok-border); font-weight: 700; }
    .opt-btn.wrong { background: var(--err-bg); border-color: var(--err-border); }
    .explanation {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
      font-size: 0.88rem; color: var(--muted); white-space: pre-line;
    }
    .explanation a { color: var(--primary); word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>QuizWalah Daily Current Affairs</h1>
        <p class="meta">Public, source-linked bilingual current-affairs practice. Topic waves unlock at 6:30 AM, 1:00 PM &amp; 6:00 PM IST.</p>
      </div>
      <div class="controls">
        <button id="lang-btn" class="btn" type="button" aria-pressed="false">हिन्दी / EN</button>
        <a class="btn" href="latest.json">JSON Feed</a>
      </div>
    </header>
    <div id="edition-meta" class="meta" style="margin-bottom: 14px;">Loading latest edition…</div>
    <div id="set-tabs" class="set-tabs"></div>
    <div id="quiz-root"></div>
  </main>
  <script>
    (function () {
      let edition = null;
      let activeSetIdx = 0;
      let lang = 'en';
      const answers = {};
      const langBtn = document.getElementById('lang-btn');
      const metaEl = document.getElementById('edition-meta');
      const tabsEl = document.getElementById('set-tabs');
      const rootEl = document.getElementById('quiz-root');

      function pickText(loc) {
        if (!loc) return '';
        if (typeof loc === 'string') return loc;
        return (lang === 'hi' && loc.hi ? loc.hi : loc.en) || loc.hi || '';
      }

      function render() {
        if (!edition || !Array.isArray(edition.sets) || !edition.sets.length) {
          rootEl.textContent = 'No published quiz sets found.';
          return;
        }
        const now = Date.now();
        metaEl.textContent = 'Edition date: ' + edition.date + ' · ' + edition.sets.length + ' topic sets';
        tabsEl.innerHTML = '';
        edition.sets.forEach(function (s, idx) {
          const releaseMs = s.release_at ? Date.parse(s.release_at) : 0;
          const locked = releaseMs && releaseMs > now;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn';
          b.setAttribute('aria-pressed', String(idx === activeSetIdx));
          b.textContent = (idx + 1) + '. ' + s.title + (locked ? ' (Unlocks later)' : '');
          b.onclick = function () { activeSetIdx = idx; render(); };
          tabsEl.appendChild(b);
        });

        const currentSet = edition.sets[activeSetIdx] || edition.sets[0];
        const releaseMs = currentSet.release_at ? Date.parse(currentSet.release_at) : 0;
        rootEl.innerHTML = '';
        if (releaseMs && releaseMs > now) {
          const lockCard = document.createElement('div');
          lockCard.className = 'card';
          lockCard.textContent = 'This topic set unlocks at ' + new Date(releaseMs).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) + ' IST.';
          rootEl.appendChild(lockCard);
          return;
        }
        (currentSet.questions || []).forEach(function (q, qIdx) {
          const card = document.createElement('div');
          card.className = 'card';
          const title = document.createElement('p');
          title.className = 'q-title';
          title.textContent = 'Q' + (qIdx + 1) + '. ' + pickText(q.prompt);
          card.appendChild(title);

          const optsWrap = document.createElement('div');
          optsWrap.className = 'options';
          const chosen = answers[q.id];
          (q.options || []).forEach(function (opt) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            if (chosen) {
              if (opt.id === q.correct_option_id) btn.className += ' correct';
              else if (opt.id === chosen) btn.className += ' wrong';
            }
            btn.textContent = (opt.label || opt.id.toUpperCase()) + '. ' + pickText(opt.text);
            btn.onclick = function () {
              answers[q.id] = opt.id;
              render();
            };
            optsWrap.appendChild(btn);
          });
          card.appendChild(optsWrap);

          if (chosen) {
            const exp = document.createElement('div');
            exp.className = 'explanation';
            exp.textContent = pickText(q.explanation);
            if (q.source_label && /^https?:\/\//i.test(q.source_label)) {
              const br = document.createElement('br');
              const link = document.createElement('a');
              link.href = q.source_label;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = 'Read source article';
              exp.appendChild(br);
              exp.appendChild(link);
            }
            card.appendChild(exp);
          }
          rootEl.appendChild(card);
        });
      }

      langBtn.onclick = function () {
        lang = lang === 'en' ? 'hi' : 'en';
        langBtn.setAttribute('aria-pressed', String(lang === 'hi'));
        document.documentElement.lang = lang;
        render();
      };

      fetch('latest.json')
        .then(function (r) { return r.json(); })
        .then(function (data) { edition = data; render(); })
        .catch(function () { metaEl.textContent = 'Could not load latest.json.'; });
    })();
  </script>
</body>
</html>
