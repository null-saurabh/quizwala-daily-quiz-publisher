name: Daily current affairs
on:
  schedule:
    - cron: '45 12 * * *' # 18:15 IST: 1st run - prepare tomorrow after all 3 waves of today are live (18:00 IST)
    - cron: '0 14 * * *'  # 19:30 IST: 2nd run - top-up/retry if incomplete
    - cron: '30 16 * * *' # 22:00 IST: 3rd run - top-up/retry if incomplete
    - cron: '30 19 * * *' # 01:00 IST: 4th run - overnight retry if incomplete
    - cron: '30 22 * * *' # 04:00 IST: 5th run - final pre-dawn retry before 06:30 IST release
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Optional target date (YYYY-MM-DD); omit to resume the oldest incomplete edition'
        required: false
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: daily-quiz
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify generation switch
        id: gate
        env:
          SWITCH: ${{ vars.DAILY_GENERATION_ENABLED }}
        run: |
          if [ "$SWITCH" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SWITCH" = "false" ] || [ "$SWITCH" = "paused" ]; then
            echo "::warning::DAILY_GENERATION_ENABLED is explicitly set to '$SWITCH'; skipping generation."
            echo "### Daily Publisher: Explicitly paused (DAILY_GENERATION_ENABLED=$SWITCH)" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::DAILY_GENERATION_ENABLED is unset or invalid ('$SWITCH'). Set repository variable DAILY_GENERATION_ENABLED='true' (or 'paused' to intentionally pause)."
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: true
          ref: main
      - name: Run unit tests
        if: steps.gate.outputs.enabled == 'true'
        run: python3 -m unittest discover -v -s . -p "test*.py"
      - name: Reserve the target edition before calling AI
        if: steps.gate.outputs.enabled == 'true'
        id: reserve
        env:
          EDITION_DATE: ${{ inputs.edition_date }}
        run: |
          DAY=$(python3 generate.py --reserve)
          if [ -z "$DAY" ]; then
            echo 'Edition complete or attempt budget exhausted.'
            echo "### Daily Publisher: No reservation made (edition complete or attempt budget exhausted)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'QuizWalah daily publisher'
          git config user.email 'daily-publisher@users.noreply.github.com'
          git add state
          git commit -m "Reserve daily generation $DAY"
          git push
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
      - name: Short-lived Vertex credentials
        if: steps.reserve.outputs.day != ''
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/527093269107/locations/global/workloadIdentityPools/recall-daily-github/providers/github' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'recall-daily@project-2af1ec64-67d0-4b99-b40.iam.gserviceaccount.com' }}
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 600s
      - name: Generate once from public news excerpts
        id: generate
        if: steps.reserve.outputs.day != ''
        env:
          DAILY_GENERATION_ENABLED: ${{ vars.DAILY_GENERATION_ENABLED }}
          VERTEX_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERTEX_PROJECT: ${{ vars.GCP_PROJECT_ID || 'project-2af1ec64-67d0-4b99-b40' }}
          VERTEX_MODEL: ${{ vars.VERTEX_MODEL || 'gemini-3.5-flash-lite' }}
          RESERVED_DATE: ${{ steps.reserve.outputs.day }}
          EDITION_DATE: ${{ steps.reserve.outputs.day }}
        run: python3 generate.py
      - name: Persist candidate progress and validated publication
        if: always() && steps.reserve.outputs.day != ''
        run: |
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "### Daily Publisher: Generation attempt for ${{ steps.reserve.outputs.day }} did not complete publication (candidate state persisted)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Daily Publisher: Published ${{ steps.reserve.outputs.day }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          git add -A site state
          git diff --cached --quiet && exit 0
          git commit -m 'Save daily edition progress'
          git push
      - name: Out-of-band failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TARGET_DAY: ${{ steps.reserve.outputs.day || inputs.edition_date || 'scheduled' }}
        run: |
          echo "::error title=Daily Quiz Publisher Failed::Generation failed for edition ${TARGET_DAY} (run ${GITHUB_RUN_ID})."
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -m 10 -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"QuizWalah Daily Quiz Publisher failed for edition ${TARGET_DAY}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$ALERT_WEBHOOK_URL" || echo "::warning::Webhook alert delivery failed."
          fi
